name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-pc-windows-msvc
            i686-pc-windows-msvc

      - name: Build IME overlay DLL
        shell: pwsh
        run: |
          cd ime_overlay
          cargo build --release --target i686-pc-windows-msvc

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist

          Copy-Item target\x86_64-pc-windows-msvc\release\launcher.exe dist\launcher.exe
          Copy-Item target\x86_64-pc-windows-msvc\release\encoder.exe dist\encoder.exe

          if (Test-Path skins) {
            Copy-Item skins dist\skins -Recurse
          }

          if (Test-Path assets) {
            Copy-Item assets dist\assets -Recurse
          }

          if (Test-Path README.md) {
            Copy-Item README.md dist\
          }

          Compress-Archive -Path dist\* -DestinationPath L1J-3.8-launcher-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: L1J-3.8-launcher-windows-x64
          path: L1J-3.8-launcher-windows-x64.zip
